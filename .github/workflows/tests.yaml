name: Tests

on: [push, release]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: wyvox/action-setup-pnpm@v3
      - name: Build
        run: pnpm turbo build --filter='@libs/*'
      # The frontend vitest suites run in browser mode through
      # @vitest/browser-playwright, so they need chromium just like the e2e job.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: ./@apps/front
      - name: Lint
        run: pnpm turbo lint
      - name: Run frontend tests
        run: pnpm turbo test --filter='@apps/front' --filter='@libs/*-front' --concurrency=1
      - name: Run backend tests
        run: pnpm turbo test --filter='@libs/*-backend' --filter='@apps/backend'
