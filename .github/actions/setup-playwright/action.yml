name: Setup Playwright
description: >-
  Install the Playwright chromium browser and its system dependencies, with the
  browser download cached and the apt step bounded so a hung mirror fails fast
  instead of eating the whole job timeout.

inputs:
  working-directory:
    description: >-
      Directory whose node_modules resolves the Playwright CLI. Use the package
      that actually needs the browser, so the cache key follows its version.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "value=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.version.outputs.value }}-chromium

    # Kept as its own bounded step: this is the apt-get call, and it is the part
    # that hangs. 23s on a good day, >9min when a mirror stalls. Bounding is done
    # with coreutils `timeout`, because `timeout-minutes` is not a valid key on a
    # composite action step.
    - name: Install Playwright system dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        timeout --kill-after=30s 6m pnpm exec playwright install-deps chromium
        code=$?
        set -e
        if [ "$code" -eq 124 ]; then
          echo "::error::playwright install-deps exceeded 6 minutes; the apt mirror most likely stalled. Re-run the job."
        fi
        exit "$code"

    - name: Install Playwright chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        timeout --kill-after=30s 6m pnpm exec playwright install chromium
        code=$?
        set -e
        if [ "$code" -eq 124 ]; then
          echo "::error::playwright install chromium exceeded 6 minutes; the browser CDN most likely stalled. Re-run the job."
        fi
        exit "$code"
